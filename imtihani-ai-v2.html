<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امتحاني AI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050B14;--card:rgba(9,22,42,.74);--ink:#E8F4FC;--mut:#8FB0C8;--pri:#4FB3E8;--on:#04101E;--sky:#4FB3E8;--skyl:rgba(79,179,232,.16);--line:rgba(143,211,245,.22);--ok:#5FD39A;--okb:rgba(95,211,154,.14);--bad:#FF8A80;--badb:rgba(255,138,128,.14);--side:rgba(4,12,24,.8);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--side);color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
nav .logo{font-weight:700;font-size:21px;padding:4px 12px 18px}
nav .logo span{color:#8DD3F5}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#C9DCEE;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:start}
nav button b{width:24px;text-align:center;font-size:18px}
nav button.on{background:rgba(141,211,245,.18);color:#fff}
main{padding:28px;max-width:960px;width:100%}
h1{font-size:26px;margin:0 0 16px}h2{font-size:19px;margin:26px 0 12px}
.hero{background:var(--side);color:#fff;border-radius:16px;padding:26px;border-inline-start:6px solid var(--sky)}
.hero h1{margin:10px 0 6px;font-size:28px}.hero p{margin:0;color:#C9DCEE;max-width:60ch}
.chip{display:inline-block;background:rgba(141,211,245,.2);color:#BFE6FA;border-radius:99px;padding:2px 12px;font-size:14px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.act{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px;text-align:start}
.act b{width:40px;height:40px;border-radius:10px;background:var(--skyl);display:grid;place-items:center;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sj{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;font:inherit;color:var(--ink);text-align:start}
.sj b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--pri);color:var(--on);font-size:21px;margin-bottom:8px}
.sj small,small{color:var(--mut);display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:grid;gap:4px;font-weight:500}
select,input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
textarea{min-height:130px}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:500;cursor:pointer}
.btn.alt{background:var(--skyl);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.sp{flex:1}
.note{background:var(--skyl);border-radius:10px;padding:12px 14px;margin:12px 0}
.paper{background:#fff;color:#0B2545;border:1px solid #C9D6E3;border-radius:4px;padding:24px;box-shadow:0 2px 0 #C9D6E3}
.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px double #0B2545;padding-bottom:10px;margin-bottom:14px}
.ph small,.paper .hint{color:#5A6F88}.tm b{font-size:20px;margin-inline-start:6px}
.qn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.qn button{width:36px;height:36px;border-radius:50%;border:1px solid #C9D6E3;background:#fff;color:#0B2545;font:inherit;cursor:pointer}
.qn .done{background:#8DD3F5}.qn .cur{border:2px solid #0B2545;font-weight:700}
.qt{font-size:19px;margin:0 0 10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;padding:11px 14px;margin:8px 0;border:1px solid #C9D6E3;border-radius:8px;background:#fff;color:#0B2545;font:inherit;cursor:pointer;text-align:start}
.opt i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1px solid #0B2545;display:grid;place-items:center;flex:none;font-size:14px}
.opt.sel{background:#DFF1FB;border-color:#0B2545}.opt.sel i{background:#0B2545;color:#fff}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.score>div:last-child{flex:1;min-width:200px}
.big{font-size:54px;font-weight:700;line-height:1}.big small{display:inline;font-size:22px}
.bar{height:10px;background:var(--skyl);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--sky)}
.rv{border-inline-start:5px solid var(--ok)}.rv.bad{border-color:var(--bad)}
.rv p{margin:6px 0}.rv .ex{background:var(--skyl);padding:8px 12px;border-radius:8px}
.tag{display:inline-block;padding:0 10px;border-radius:99px;font-size:14px;font-weight:500}
.t1{background:var(--okb);color:var(--ok)}.t2{background:var(--skyl)}.t3{background:var(--badb);color:var(--bad)}
ul{margin:6px 0;padding-inline-start:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats .card b{font-size:28px;display:block}
@media (max-width:760px){
.app{display:block}
nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;gap:2px}
nav .logo{display:none}nav button{flex:1;flex-direction:column;gap:0;padding:6px 2px;font-size:12px;text-align:center}
main{padding:16px 14px 100px}.paper{padding:16px}h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;background:#050B14}
.vl{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 40%,rgba(5,11,20,.2),rgba(5,11,20,.82))}
.card,.act,.sj,.hero,nav,.note{backdrop-filter:blur(8px)}
option{background:#0B1E36;color:#E8F4FC}
.start{min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;padding:24px}
.start h1{font-size:clamp(46px,10vw,88px);margin:0;font-weight:700;text-shadow:0 0 34px rgba(79,179,232,.75)}
.start p{color:var(--mut);margin:0 0 18px;font-size:18px}
.menu{display:grid;gap:4px;justify-items:center}
.mi{background:none;border:0;color:var(--ink);font:inherit;font-size:23px;padding:6px 28px;cursor:pointer;opacity:.75}
.mi::before,.mi::after{content:"◆";font-size:11px;color:var(--sky);margin:0 12px;opacity:0}
.mi:hover,.mi:focus-visible{opacity:1;text-shadow:0 0 14px var(--sky)}
.mi:hover::before,.mi:hover::after,.mi:focus-visible::before,.mi:focus-visible::after{opacity:1}

/* تحسينات واجهة امتحاني AI — نسخة تجريبية */
:root{--pri:#57c7ff;--sky:#57c7ff;--skyl:rgba(87,199,255,.13);--line:rgba(135,190,225,.23)}
body{background:radial-gradient(ellipse at 80% 0%,rgba(28,89,140,.20),transparent 42%),var(--bg)}
nav{backdrop-filter:blur(18px);border-left:1px solid var(--line)}
nav .logo{letter-spacing:.1px}
nav button{transition:background .18s ease,transform .18s ease}
nav button:hover{background:rgba(87,199,255,.10);transform:translateX(-2px)}
main{max-width:1160px;width:100%;margin-inline:auto;padding:clamp(18px,3vw,38px)}
.hero{position:relative;overflow:hidden;border:1px solid rgba(87,199,255,.25);background:linear-gradient(135deg,rgba(20,63,99,.76),rgba(8,20,38,.82));border-radius:24px;padding:clamp(24px,4vw,44px);box-shadow:0 22px 65px rgba(0,0,0,.18)}
.hero:after{content:"✦";position:absolute;left:7%;top:8%;font-size:clamp(55px,10vw,100px);color:rgba(87,199,255,.14);text-shadow:0 0 35px rgba(87,199,255,.24);pointer-events:none;animation:imtGlow 4s ease-in-out infinite}
@keyframes imtGlow{0%,100%{transform:translateY(0) rotate(0deg);opacity:.55}50%{transform:translateY(-9px) rotate(14deg);opacity:1}}
.hero h1{font-size:clamp(27px,4vw,42px);line-height:1.3;margin:14px 0 10px;max-width:720px}
.hero p{max-width:650px;color:#b6d1e5}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(6,17,31,.55);padding:6px 12px;border-radius:999px;font-size:13px}
.acts{gap:12px}
.act,.sj,.card{transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease}
.act,.sj{border:1px solid var(--line)!important;border-radius:16px!important;background:linear-gradient(145deg,rgba(15,36,59,.92),rgba(7,18,33,.88))!important}
.act:hover,.sj:hover{transform:translateY(-3px);border-color:rgba(87,199,255,.55)!important;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.card{border-color:var(--line);border-radius:16px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.btn{transition:filter .18s ease,transform .18s ease;border-radius:12px}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
input,select,textarea{border-radius:12px!important;border-color:var(--line)!important}
textarea{line-height:1.8}
.ai-hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin:18px 0}
.ai-provider{border:1px solid var(--line);background:rgba(7,19,35,.65);border-radius:14px;padding:14px;min-width:0}
.ai-provider b{display:block;margin-bottom:4px}
.ai-provider small{color:var(--mut)}
.ai-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e6b85c;margin-left:7px;box-shadow:0 0 10px currentColor}
.ai-callout{border:1px solid rgba(95,211,154,.22);background:rgba(95,211,154,.06);border-radius:14px;padding:13px 15px;margin:12px 0;color:var(--ink)}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{position:sticky;top:0;z-index:5;height:auto;padding:8px;display:flex;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);gap:4px}nav .logo{font-size:16px;padding:8px;white-space:nowrap}nav button{white-space:nowrap;padding:8px 10px;font-size:13px}main{padding:16px}.hero{border-radius:18px}.hero:after{left:3%;top:4%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

</style>
</head>

function start(){
const c=S.cfg;
if(c.src=="book"&&BK){const [a,b]=pr();S.msg="الامتحان من صفحات كتابك ("+a+" إلى "+b+") يحتاج ربط الذكاء الاصطناعي، وهو غير متصل بعد. الصفحات جاهزة، ويمكنك تجربة البنك التجريبي بدلًا منها.";return render()}
let p=Q.map((q,i)=>i).filter(i=>{const q=Q[i];return q[0]==S.subj&&(c.unit=="all"||q[1]==c.unit)&&(c.type=="mix"||q[2]==c.type)&&(!c.diff||q[3]==c.diff)});
if(!p.length){S.msg="لا توجد أسئلة تجريبية تطابق هذه الاختيارات. جرّب تغيير النوع أو الصعوبة.";return render()}
p=sh(p).slice(0,c.n);S.msg="";
S.ex={qs:p,a:p.map(()=>null),cur:0,end:Date.now()+c.dur*60000,subj:S.subj,conf:0};
clearInterval(TM);
TM=setInterval(()=>{const e=S.ex;if(!e){clearInterval(TM);return}const r=Math.max(0,Math.round((e.end-Date.now())/1000));const el=$("#tm");if(el)el.textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0");if(r<=0)submit()},500);
go("ex")}

function submit(){
const e=S.ex;if(!e)return;clearInterval(TM);
const items=e.qs.map((qi,j)=>({q:qi,a:e.a[j],ok:e.a[j]===Q[qi][6]}));
const r={id:Date.now(),d:new Date().toLocaleDateString("ar-JO"),subj:e.subj,items,score:items.filter(x=>x.ok).length,total:items.length};
D.exams.unshift(r);save();S.ex=null;S.res=r;go("res")}

<div class="note"><b>حالة الربط:</b> هذه الواجهة جاهزة للاتصال بمسار <code>/api/tutor</code>، لكنها لن تولّد إجابات فعلية قبل تشغيل الخادم وإضافة مفتاح API في إعدادات الخادم فقط.</div>`;

V.prog=()=>{const ex=D.exams,n=ex.length,avg=n?Math.round(ex.reduce((s,r)=>s+r.score/r.total,0)/n*100):0,u={};
ex.forEach(r=>r.items.forEach(x=>{const q=Q[x.q];u[q[1]]=u[q[1]]||{s:q[0],t:0,c:0};u[q[1]].t++;if(x.ok)u[q[1]].c++}));
const us=Object.entries(u).map(([k,v])=>({k,s:v.s,p:Math.round(v.c/v.t*100)})),weak=us.filter(x=>x.p<60);
return `<h1>تقدّمي</h1><div class="stats"><div class="card"><b>${n}</b>امتحانات محلولة</div><div class="card"><b>${n?avg+"%":"—"}</b>المعدل العام</div><div class="card"><b>${D.sums.length}</b>ملخصات محفوظة</div></div>
${n?`<h2>الأداء حسب الموضوع</h2><div class="card">${us.map(x=>`<div>${x.k} · ${SUBJ[x.s].n}<div class="bar"><i style="width:${x.p}%"></i></div><small>${x.p}%</small></div>`).join("")}</div>
<h2>موضوعات تحتاج إلى مراجعة</h2>${weak.length?weak.map(x=>`<div class="card row" style="margin-top:0"><b>${x.k}</b><small>${x.p}%</small><span class="sp"></span><button class="btn alt" onclick="weakGo('${x.s}')">راجع الملخص</button></div>`).join(""):`<div class="note">لا توجد موضوعات ضعيفة حاليًا. أحسنت!</div>`}`:`<div class="note">لم تحل أي امتحان بعد. ابدأ بامتحان قصير لتظهر هنا نقاط قوتك وضعفك.</div><button class="btn" onclick="go('exam')">إنشاء امتحان</button>`}
<h2 id="hist">الامتحانات السابقة</h2>${n?ex.map(r=>`<div class="card row" style="margin-top:0"><b>${SUBJ[r.subj].n}</b><small>${r.d}</small><span class="sp"></span><b>${r.score}/${r.total}</b><button class="btn alt" onclick="openRes(${r.id})">عرض النتيجة</button></div>`).join(""):`<div class="note">لا توجد امتحانات محفوظة بعد.</div>`}
<h2>الملخصات المحفوظة</h2>${D.sums.length?D.sums.map(x=>`<div class="card row" style="margin-top:0"><b>${x.u}</b><small>${SUBJ[x.s].n}</small><span class="sp"></span><button class="btn alt" onclick="weakGo('${x.s}')">فتح</button></div>`).join(""):`<div class="note">لم تحفظ أي ملخص بعد.</div>`}
<div class="row"><button class="btn alt" onclick="reset()">${S.confirmReset?"تأكيد: حذف كل بياناتي":"حذف بياناتي المحفوظة"}</button></div>`};

let BK=null;try{BK=JSON.parse(localStorage.getItem("imtihani_book")||"null")}catch(e){}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pr=()=>{const n=BK?BK.pages.length:1,a=Math.min(Math.max(+S.cfg.pa||1,1),n),b=Math.min(Math.max(+S.cfg.pb||Math.min(5,n),a),n);return [a,b]};
function bookJob(kind,a,b){const t=BK.pages.slice(a-1,b).map((p,i)=>`[صفحة ${a+i}]\n${p}`).join("\n\n");const m={exam:"ولّد أسئلة امتحان",sum:"لخّص إلى: أساسية، مهمة، إضافية",key:"استخرج النقاط المهمة"}[kind];return `${m} من النص التالي فقط، دون أي معلومة من خارجه، واذكر رقم الصفحة لكل سؤال أو نقطة.\n\n${t}`}
function loadPdfJs(){return new Promise((ok,no)=>{if(window.pdfjsLib)return ok();const s=document.createElement("script");const B="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";s.src=B+"pdf.min.js";s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=B+"pdf.worker.min.js";ok()};s.onerror=no;document.head.appendChild(s)})}
async function readBook(f){if(!f)return;const st=$("#bs");st.className="note";try{st.textContent="جارٍ تجهيز القارئ...";await loadPdfJs();const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;const pages=[];for(let i=1;i<=pdf.numPages;i++){st.textContent="جارٍ قراءة الصفحة "+i+" من "+pdf.numPages;const c=await(await pdf.getPage(i)).getTextContent();pages.push(c.items.map(x=>x.str).join(" ").replace(/\s+/g," ").trim())}BK={name:f.name,pages};try{localStorage.setItem("imtihani_book",JSON.stringify(BK))}catch(e){BK.mem=1}S.cfg.pa=1;S.cfg.pb=Math.min(5,pages.length);render()}catch(e){st.textContent="تعذّرت قراءة الملف. تأكد أنه PDF سليم وغير محمي بكلمة مرور."}}
async function bookGo(kind){const [a,b]=pr(),o=$("#bn");o.className="note";const job=bookJob(kind,a,b);try{o.textContent=await AI.ask(job)}catch(e){o.innerHTML="<b>الذكاء الاصطناعي غير متصل بعد.</b> الصفحات "+a+" إلى "+b+" جاهزة ("+job.length+" حرفًا)، وسيُبنى عليها الطلب فور ربط النموذج. لم يُرسل شيء إلى أي جهة."}}
V.start=()=>`<section class="start"><h1>امتحاني AI</h1><p>رفيقك في الدراسة للصف العاشر</p><div class="menu"><button class="mi" onclick="go('home')">ابدأ</button><button class="mi" onclick="go('lib')">أضف منهجك</button><button class="mi" onclick="go('prog')">تقدّمي</button></div></section>`;
V.lib=()=>{const n=BK?BK.pages.length:0,[a,b]=pr(),txt=BK?BK.pages.slice(a-1,b).join("\n\n"):"",thin=BK&&BK.pages.join("").length<n*40;
return `<h1>منهجي</h1><div class="card"><p style="margin-top:0">ارفع كتابك بصيغة PDF. يُقرأ الملف داخل جهازك ولا يُرسل إلى أي جهة.</p><label>ملف الكتاب<input type="file" accept="application/pdf" onchange="readBook(this.files[0])"></label><div id="bs"></div></div>
${BK?`<div class="card"><b>${esc(BK.name)}</b><small>${n} صفحة${BK.mem?" · لن يبقى محفوظًا بعد إغلاق الصفحة لأن حجمه كبير":""}</small>${thin?`<div class="note">النص المستخرج قليل جدًا، وقد يكون الكتاب صورًا ممسوحة ضوئيًا. يلزم عندها قارئ نصوص OCR.</div>`:""}
<div class="form" style="margin-top:12px"><label>من صفحة<input type="number" min="1" max="${n}" value="${a}" onchange="S.cfg.pa=+this.value;render()"></label><label>إلى صفحة<input type="number" min="1" max="${n}" value="${b}" onchange="S.cfg.pb=+this.value;render()"></label></div>
<div class="row"><button class="btn" onclick="bookGo('exam')">ابنِ امتحانًا</button><button class="btn alt" onclick="bookGo('sum')">لخّص الصفحات</button><button class="btn alt" onclick="bookGo('key')">استخرج النقاط المهمة</button></div><div id="bn"></div></div>
<h2>معاينة النص المستخرج</h2><div class="note">قد يختلف ترتيب بعض الكلمات العربية بعد الاستخراج. راجع المعاينة قبل الاعتماد عليها.</div><div class="card" dir="auto" style="white-space:pre-wrap;max-height:280px;overflow:auto">${esc(txt.slice(0,1500))||"لا يوجد نص في هذه الصفحات."}</div>`:`<div class="note">لم ترفع كتابًا بعد.</div>`}`};
function render(){
if(S.v=="start"){$("#app").className="";$("#app").innerHTML=V.start();return}
$("#app").className="app";
const nv=[["home","الرئيسية","⌂"],["exam","امتحان","✎"],["sum","الملخصات","☰"],["lib","منهجي","▤"],["tutor","المعلم","؟"],["prog","تقدّمي","↗"]];
const cur=S.v=="ex"||S.v=="res"?"exam":S.v;
$("#app").innerHTML=`<nav><div class="logo" style="cursor:pointer" onclick="go('start')">امتحاني <span>AI</span></div>${nv.map(n=>`<button class="${n[0]==cur?"on":""}" onclick="go('${n[0]}')"><b>${n[2]}</b>${n[1]}</button>`).join("")}</nav><main>${V[S.v]()}</main>`}
render();
const bv=$("#bg");bv.muted=true;if(matchMedia("(prefers-reduced-motion:reduce)").matches)bv.pause();else bv.play().catch(()=>{});
</script>
</body>
</html>
